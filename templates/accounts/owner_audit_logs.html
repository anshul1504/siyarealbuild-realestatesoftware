{% extends "base.html" %}{% block content %}<div class="container-fluid"><h4>Audit Logs</h4><div class="card card-body table-responsive"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.created_at }}</td><td>{{ log.actor|default:"System" }}</td><td>{{ log.action }}</td><td>{{ log.target_label }}</td><td>{{ log.details }}</td></tr>{% empty %}<tr><td colspan="5">No audit entries.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
