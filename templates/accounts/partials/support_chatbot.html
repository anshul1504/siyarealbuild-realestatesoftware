<div class="auth-support-widget" aria-live="polite">
  <button class="auth-support-toggle" type="button" aria-label="Open support chat" aria-expanded="false">
    <span class="ui-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M8 9h8M8 13h5"/></svg>
    </span>
    <span>Support</span>
  </button>

  <section class="auth-support-panel" aria-label="Authentication support">
    <div class="auth-support-head">
      <div>
        <strong>Need help?</strong>
        <span>Signup and login support</span>
      </div>
      <button class="auth-support-close" type="button" aria-label="Close support chat">x</button>
    </div>

    <div class="auth-support-feed">
      <div class="auth-support-message bot">Please select a common question or submit the support form. Our team will review your request and contact you shortly.</div>
    </div>

    <div class="auth-support-faq">
      <button type="button" data-support-reply="After signup, please verify your email with the OTP. Your request will then be reviewed by the admin team. Once approved, you can sign in using email OTP.">When will my signup be approved?</button>
      <button type="button" data-support-reply="Please confirm that the email address is correct, check your spam folder, and use Resend OTP after the countdown finishes.">I did not receive the OTP</button>
      <button type="button" data-support-reply="If your email is already registered, your request may already be pending review, approved, or rejected. Please submit a support request if you need assistance.">Email already registered</button>
    </div>

    <form class="auth-support-form" method="post" action="{% url 'accounts:support_request' %}">
      {% csrf_token %}
      <input type="hidden" name="page_url" value="{{ request.get_full_path }}">
      <div class="auth-support-grid">
        <input type="text" name="support_name" placeholder="Your name" aria-label="Your name" required>
        <input type="text" name="support_contact" placeholder="Email or phone" aria-label="Email or phone">
      </div>
      <textarea name="support_issue" rows="3" placeholder="Describe your issue" aria-label="Describe your issue" required></textarea>
      <button type="submit">Send help request</button>
    </form>
  </section>
</div>
