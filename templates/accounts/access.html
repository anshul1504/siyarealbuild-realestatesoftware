{% extends "base.html" %}
{% block title %}Role Access - Siya Real Build{% endblock %}
{% block content %}
<div class="app-page-head">
    <h1 class="app-page-title mb-0">Role Based Access</h1>
    <p class="text-body mb-0">Company owner can control team access roles.</p>
</div>
<section class="profile-panel">
    <form method="post" class="profile-form">
        {% csrf_token %}
        <div class="row g-3">
            {% for field in form %}
            <div class="col-md-6">
                <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
            </div>
            {% empty %}
            <div class="col-12 text-body">No team members yet.</div>
            {% endfor %}
            <div class="col-12 d-flex justify-content-end">
                <button class="btn btn-primary" type="submit">Update Roles</button>
            </div>
        </div>
    </form>
</section>
{% endblock %}
