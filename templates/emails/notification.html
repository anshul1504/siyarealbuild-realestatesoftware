<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
</head>
<body style="margin:0;background:#f4efe6;font-family:Arial,'Helvetica Neue',sans-serif;color:#181511;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe6;padding:34px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:620px;background:#ffffff;border:1px solid #eadcc1;border-radius:18px;overflow:hidden;box-shadow:0 22px 58px rgba(58,43,22,.14);">
                    <tr>
                        <td style="padding:0;background:#ffffff;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
                                <tr>
                                    <td style="padding:34px 34px 30px;text-align:left;vertical-align:middle;background:#ffffff;">
                                        <div style="display:inline-block;background:#ffffff;border-radius:14px;padding:0;">
                                            <img src="cid:siya-logo" width="230" alt="Siya Real Build" style="display:block;width:230px;max-width:230px;height:auto;border:0;outline:none;text-decoration:none;">
                                        </div>
                                    </td>
                                    <td style="padding:34px 34px 30px;text-align:right;vertical-align:middle;background:#ffffff;">
                                        <span style="display:inline-block;padding:9px 15px;border:1px solid #eadcc1;border-radius:999px;color:#c2680f;background:#ffffff;font-size:12px;line-height:1;font-weight:800;text-transform:uppercase;">{{ badge }}</span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:34px 34px 16px;text-align:center;">
                            <p style="margin:0 0 10px;color:#c2680f;font-size:12px;line-height:1.4;text-transform:uppercase;font-weight:800;letter-spacing:1px;">Siya Real Build Pvt. Ltd.</p>
                            <h1 style="margin:0 0 12px;color:#181511;font-size:30px;line-height:1.16;font-weight:800;">{{ title }}</h1>
                            <p style="margin:0 auto 24px;max-width:450px;color:#665d51;font-size:15px;line-height:1.65;">{{ intro }}</p>
                        </td>
                    </tr>
                    {% if code %}
                    <tr>
                        <td align="center" style="padding:0 34px 30px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                                <tr>
                                    <td style="padding:18px 28px;background:#fff3df;border:1px solid #e4c781;border-radius:16px;color:#181511;font-size:38px;line-height:1;font-weight:900;letter-spacing:10px;text-align:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);">{{ code }}</td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    {% endif %}
                    {% if body %}
                    <tr>
                        <td style="padding:0 34px 30px;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff3df;border:1px solid #e4c781;border-radius:16px;">
                                <tr>
                                    <td style="padding:24px;text-align:left;">
                                        <p style="margin:0;color:#3f3428;font-size:15px;line-height:1.75;">{{ body }}</p>
                                        {% if cta_text %}
                                            <p style="margin:20px 0 0;padding:12px 15px;background:#181511;border-radius:12px;color:#fff;font-size:14px;line-height:1.5;font-weight:800;text-align:center;">{{ cta_text }}</p>
                                        {% endif %}
                                        {% if cta_url %}
                                            <p style="margin:20px 0 0;text-align:center;"><a href="{{ cta_url }}" style="display:inline-block;padding:12px 18px;background:#f57f17;color:#ffffff;border-radius:12px;text-decoration:none;font-size:14px;line-height:1.5;font-weight:800;">{{ cta_link_text|default:"Open link" }}</a></p>
                                        {% endif %}
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    {% endif %}
                    <tr>
                        <td style="padding:20px 28px 24px;background:#fffaf2;border-top:1px solid #eadcc1;text-align:center;">
                            <p style="margin:0;color:#c2680f;font-size:12px;line-height:1.5;font-weight:800;">Design and developed by <a href="https://www.thewebfix.in/" target="_blank" style="color:#c2680f;text-decoration:none;">The Webfix</a></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
