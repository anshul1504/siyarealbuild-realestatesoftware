{% if page_obj.paginator.num_pages > 1 %}
<nav class="property-detail-pagination" aria-label="Pagination">
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div>
    {% if page_obj.has_previous %}<a class="btn btn-light btn-sm" href="?{{ page_param }}={{ page_obj.previous_page_number }}&{{ other_param }}={{ other_page }}">Previous</a>{% endif %}
    {% if page_obj.has_next %}<a class="btn btn-light btn-sm" href="?{{ page_param }}={{ page_obj.next_page_number }}&{{ other_param }}={{ other_page }}">Next</a>{% endif %}
  </div>
</nav>
{% endif %}
