<body>
  <div class="page-layout">

    <div class="auth-frame-wrapper" style="background-image: url(../../..//assets/images/auth.jpg);">
      <div class="inner-wrap">
        <div class="mb-4 text-center">
          <a href="http://../index.html" aria-label="UrbanHub logo">
            <img class="visible-light" src="http://../assets/images/logo-full.svg" alt="UrbanHub logo">
            <img class="visible-dark" src="http://../assets/images/logo-full-white.svg" alt="UrbanHub logo">
          </a>
        </div>
        <div class="text-center mb-5">
          <h5 class="mb-1">Welcome to UrbanHub</h5>
          <p>Sign up to create your secure admin.</p>
        </div>
        <form action="http://../index.html">
          <div class="mb-4">
            <label class="form-label" for="registerName">Name</label>
            <input type="text" class="form-control" id="registerName" placeholder="Full Name">
          </div>
          <div class="mb-4">
            <label class="form-label" for="registerEmail">Email Address</label>
            <input type="email" class="form-control" id="registerEmail" placeholder="info@example.com">
          </div>
          <div class="mb-4">
            <label class="form-label" for="registerPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" class="form-control password-input" id="registerPassword" placeholder="********">
              <button type="button" id="togglePassword" class="toggle-password" aria-pressed="false" aria-label="Show password" title="Show password">
                <i class="close fi fi-rr-eye-crossed" aria-hidden="true"></i>
                <i class="open fi fi-rr-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <div class="mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="termsConditions" name="terms">
              <label class="form-check-label" for="termsConditions">
                I agree to <a class="text-dark" href="javascript:void(0);">privacy policy & terms</a>
              </label>
            </div>
          </div>
          <div class="mb-3">
            <button type="submit" value="Submit" class="btn btn-primary w-100">Sign up</button>
          </div>
          <p class="mb-0 text-center">Have any account? <a class="text-dark" href="http://../authentication/login.html">Sign In here</a>
          </p>
        </form>
      </div>
    </div>

  </div>
